openapi: 3.0.3

info:
  title: Greenlight API
  version: 1.0.0
  description: |
    JSON API for retrieving and managing information about movies.

    ## Versioning
    - The **major** version is part of the URL path (`/v1`). A breaking change
      ships as a new major version under a new prefix (`/v2`) with its own
      contract at `api/v2/openapi.yaml`; `/v1` keeps working unchanged.
    - `info.version` follows semver and matches the `version` constant in
      `cmd/api/main.go` (also reported by `GET /healthcheck`). Bump the minor
      version for backwards-compatible additions and the patch version for fixes.
    - Each movie record also carries its own `version`, used for optimistic
      locking on updates.

servers:
  - url: http://localhost:{port}/v1
    description: Local development
    variables:
      port:
        default: "4000"

tags:
  - name: Healthcheck
  - name: Movies

paths:
  /healthcheck:
    get:
      tags: [Healthcheck]
      summary: Show application status
      operationId: healthcheck
      responses:
        "200":
          description: Application is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthcheckResponse"
              example:
                status: available
                system_info:
                  environment: development
                  version: 1.0.0
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/ServerError"

  /movies:
    post:
      tags: [Movies]
      summary: Create a movie
      operationId: createMovie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMovieRequest"
            example:
              title: Moana
              year: 2016
              runtime: 107
              genres: [animation, adventure]
      responses:
        "201":
          description: Movie created
          headers:
            Location:
              description: URL of the newly created movie
              schema:
                type: string
                example: /v1/movies/1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/FailedValidation"
        "500":
          $ref: "#/components/responses/ServerError"

  /movies/{id}:
    parameters:
      - $ref: "#/components/parameters/MovieID"

    get:
      tags: [Movies]
      summary: Show a movie
      operationId: showMovie
      responses:
        "200":
          description: The requested movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    patch:
      tags: [Movies]
      summary: Partially update a movie
      description: |
        Only the fields present in the body are changed; omitted fields keep
        their current value. The merged movie is validated with the same rules
        as create. Returns 409 if the movie was modified (or deleted) by
        another request between being read and written.
      operationId: updateMovie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMovieRequest"
            example:
              year: 2017
      responses:
        "200":
          description: Movie updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EditConflict"
        "422":
          $ref: "#/components/responses/FailedValidation"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Movies]
      summary: Delete a movie
      operationId: deleteMovie
      responses:
        "200":
          description: Movie deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: movie successfully deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  parameters:
    MovieID:
      name: id
      in: path
      required: true
      description: Movie ID. Values that aren't positive integers return 404.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  schemas:
    Movie:
      type: object
      required: [id, title, year, runtime, genres, version]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Moana
        year:
          type: integer
          format: int32
          example: 2016
        runtime:
          type: integer
          format: int32
          description: Runtime in minutes
          example: 107
        genres:
          type: array
          items:
            type: string
          example: [animation, adventure]
        version:
          type: integer
          format: int32
          description: Incremented on every update; used for optimistic locking.
          example: 1

    CreateMovieRequest:
      type: object
      additionalProperties: false
      required: [title, year, runtime, genres]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
          description: Must not be empty; at most 500 bytes.
        year:
          type: integer
          format: int32
          minimum: 1888
          description: Between 1888 and the current year.
        runtime:
          type: integer
          format: int32
          minimum: 1
          description: Runtime in minutes; must be positive.
        genres:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string

    UpdateMovieRequest:
      type: object
      additionalProperties: false
      description: All fields optional; same constraints as CreateMovieRequest.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        year:
          type: integer
          format: int32
          minimum: 1888
        runtime:
          type: integer
          format: int32
          minimum: 1
        genres:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string

    MovieResponse:
      type: object
      required: [movie]
      properties:
        movie:
          $ref: "#/components/schemas/Movie"

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    HealthcheckResponse:
      type: object
      required: [status, system_info]
      properties:
        status:
          type: string
          example: available
        system_info:
          type: object
          required: [environment, version]
          properties:
            environment:
              type: string
              enum: [development, staging, production]
            version:
              type: string
              example: 1.0.0

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          description: Map of field name to the first validation error for that field.
          additionalProperties:
            type: string

  responses:
    BadRequest:
      description: |
        Request body couldn't be decoded: empty or truncated, malformed JSON,
        wrong JSON type for a field, unknown field, or larger than 1MB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: body contains unknown field "rating"

    NotFound:
      description: The requested resource could not be found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: the requested resource could not be found

    MethodNotAllowed:
      description: HTTP method not supported for this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: the PUT method is not supported for this resource

    EditConflict:
      description: The record was changed by another request; fetch it again and retry
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: unable to update the record due to an edit conflict, please try again

    FailedValidation:
      description: Body decoded fine but one or more fields failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            error:
              title: must be provided
              year: must be greater than 1888

    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: the server encountered a problem and could not process your request
